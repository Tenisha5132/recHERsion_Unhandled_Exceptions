irregular_cycle:
  description: "Irregular periods definition per NHS"
  gap_lt21_days:
    value: 21
    op: "<"
    source_url: "https://www.nhs.uk/conditions/irregular-periods/"
    kb_file: "irregular-periods.md"
    note: "NHS states periods may be irregular if gap <21 or >35 days"
